[project]
name = "safetyrules"
version = "0.1.0"
description = "Toy multilingual safety rules engine for an imaginary health chat assistant. Not medical advice."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.17.6",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "hypothesis==6.170.17",
  "mutmut==3.8.1",
  "pre-commit==4.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "RUF001", "S311"]
"safetyrules/*" = ["RUF001"]
"evals/*" = ["RUF001", "S311"]

[tool.mypy]
strict = true
files = ["safetyrules", "tests", "evals", "tools"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["safetyrules", "evals"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mutmut]
source_paths = ["safetyrules/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["evals/"]
